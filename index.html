<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idle Ascension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- la fuente no bloquea el arranque: si tarda o falla, se usa la del sistema -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" media="print" onload="this.media='all'">
<style>
/* ARCHIVO GENERADO por tools/construir.js desde src/estilos/ (orden en orden.json): no lo edites aquí. */
:root{
  color-scheme: dark;
  --bg:#12141c; --panel:#1b1e2a; --panel2:#232738; --line:#2f3448;
  --ink:#ece7da; --muted:#9a9fb3; --gold:#e8b04a; --gold-ink:#1b1406;
  --good:#6cc47a; --bad:#e2605a; --tok:#7fc8e8;
  --rC:#a3a8b4; --rU:#62c275; --rR:#4f95e6; --rE:#b066e8; --rL:#f2912f; --rM:#ff4f79;
  --display:var(--body);
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
.boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg)}
.boot b{font-family:var(--display);font-size:26px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.boot span{color:var(--muted);font-size:13px}
.silh{flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#syncBox{z-index:150;text-align:center;padding:0 24px}
#ctlBox{z-index:200;text-align:center;padding:0 24px} /* cartel de mantenimiento/actualización: por encima de todo */
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
:root{--safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}   /* hueco de los botones de Telegram en pantalla completa */
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + var(--safe-top)) 90px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-inline:-10px}   /* la cabecera va casi pegada al borde (6 px) */
.uname{font-family:var(--display);font-weight:800;font-size:14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:0;white-space:nowrap;line-height:1.15}
.uname .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.uname em{flex:none;font-style:normal;color:var(--muted);font-family:var(--body);font-size:11px}
.res{flex:none}
.top.slim{position:sticky;top:0;z-index:6;padding:6px 10px;margin:-6px -10px 6px;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.top.slim .av,.top.slim .uname{display:none}
.sttl{display:none}
.top.slim .sttl{display:block;flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:1.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:374px){.top.slim .sttl{font-size:13px;letter-spacing:1px}.top.slim .res span{padding:2px 7px 2px 4px}}
.top.slim .res span{background:#0006;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 5px}
.top.slim .res{gap:5px}
.namebox{display:flex;flex-direction:column;gap:4px}
#pNameIn,.nameinp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.fase{font-family:var(--display);font-size:20px;letter-spacing:.5px}
.fase small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:0;margin-left:6px}
.res{display:flex;gap:8px;font-variant-numeric:tabular-nums;font-weight:800}
.res span{display:flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ic{width:15px;height:15px;flex:none}
[hidden]{display:none!important}
.battle{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;border-radius:14px;overflow:visible;border:1px solid var(--line);background:#0e1017;margin-bottom:1px} /* visible: las calaveras y la fase salen unos píxeles por debajo del borde */
canvas{border-radius:13px}
canvas{display:block;width:100%;height:300px}
.app.home{height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app.home .battle{flex:1;min-height:0}
.app.home .stage{flex:1;min-height:clamp(140px,32vh,260px)} /* en pantallas bajas (Telegram compacto) el escenario encoge y los botones no tapan al héroe */
.app.home canvas{position:absolute;inset:0;height:100%}
.app.home #tab{display:none}
.app.home{padding-top:calc(24px + var(--safe-top))}
.tgfs .app,.tgfs .app.home{padding-top:var(--safe-top)}
.app.home .battle{padding-bottom:58px}
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hero .name{font-family:var(--display);font-size:16px;grid-column:1 / -1;display:flex;align-items:baseline;min-width:0;white-space:nowrap}
.hero .name .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero .name em{flex:none}
.hero #evoSlot:empty{display:none}
.hero .name em{font-style:normal;color:var(--muted);font-family:var(--body);font-size:12px;margin-left:6px}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;grid-column:1 / -1}
.bar i{display:block;height:100%;background:var(--good);width:0%}
.bar.xp i{background:var(--tok)}
.hbar{grid-column:1 / -1;display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbar .bar{grid-column:auto}
.hbar b{color:var(--ink);min-width:44px;text-align:right}
.statline{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.statline b{color:var(--ink);font-weight:800}
#hStats{flex-direction:column;gap:4px}
#hStats .sl{display:flex;flex-wrap:wrap;gap:4px 12px}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.on{border-color:var(--gold);color:var(--gold)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--display);font-weight:600;font-size:17px}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:800}
.s{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
/* brillo morado suave: halo en el combate y los paneles, y una línea de luz en el borde de la barra de abajo */
.stage,.panel{box-shadow:0 0 12px rgba(150,80,255,.16)}
.nav::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(190,140,255,.85) 50%,transparent);box-shadow:0 0 8px 1px rgba(150,80,255,.45)}
.nav div{display:flex;gap:2px;max-width:520px;width:100%}
.nav button{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:10px 2px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted)}
.nav button[aria-selected="true"]{background:var(--panel2);color:var(--gold)}
.wcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.wcard.eq{border-color:var(--gold)}
.wcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.wcard .nm{font-weight:800}
.rar{font-family:var(--display);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.rbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
.rbar i{display:block;height:100%}
.rmax{flex:none;width:34px;text-align:center;font-size:10px;font-weight:800;color:var(--good)}
.chest{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--panel2)}
.chest .cn{font-family:var(--display);font-size:17px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.mrow.done{opacity:.55}
.mrow.ready{border-color:var(--good);background:linear-gradient(135deg,rgba(108,196,122,.14),var(--panel2))}
.mrow .mbar{display:flex;align-items:center;gap:8px}
.mrow .mbar .rbar{flex:1;height:8px;background:#0007;box-shadow:inset 0 1px 2px #0008}
.mrow .mbar .rbar i{background:linear-gradient(90deg,#c98d2e,var(--gold))}
.mrow.ready .mbar .rbar i{background:linear-gradient(90deg,#4f9e5c,var(--good))}
.mrow .mbar span{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .mrw{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px}
.mrow .mrw .rw{background:#0004;border-radius:999px;padding:2px 7px 2px 4px;margin:0}
.mrow .mrw .rw.xp{color:var(--tok);padding-left:7px}
.mrow .mgo{min-width:64px}
.mrow .mclaim{min-width:84px;animation:mglow 1.6s ease-in-out infinite}
@keyframes mglow{50%{box-shadow:0 0 0 3px #e8b04a44,0 0 14px #e8b04a88}}
.mcheck,.mlock{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.mcheck{background:var(--good);color:#10231a}
.mlock{background:#0004;font-size:13px;filter:grayscale(1);opacity:.7}
.mrow .mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.calg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cald{display:flex;flex-direction:column;gap:3px;padding:8px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:11px;text-align:center;min-height:74px;justify-content:center}
.cald b{font-size:11px;line-height:1.2;overflow-wrap:anywhere}
.cald.got{opacity:.5}
.cald.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cald:last-child{grid-column:span 2}
.phead{display:flex;flex-direction:column;gap:4px}.phead>div:first-child{display:flex;justify-content:space-between;align-items:baseline}
.pwrap{display:flex;gap:6px;align-items:stretch}
.plabels{display:grid;grid-template-rows:74px 26px 74px;gap:6px;padding-top:4px;font-size:10px;font-weight:900;letter-spacing:.08em}
.plabels span{writing-mode:vertical-rl;transform:rotate(180deg);display:grid;place-items:center}.plabels .ppay{grid-row:3}
.plabels .pfree{color:#b9c0cc}.plabels .ppay{color:var(--gold)}
.ptrack{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;flex:1;min-width:0}
.pcol{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 74px;scroll-snap-align:center}
.pcol::before{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:6px;margin-top:-3px;background:#2a2e42}   /* la barra de progreso, tramo a tramo */
.pcol.open::before{background:linear-gradient(90deg,#c9932f,#e8b04a)}.pcol:first-child::before{left:50%}.pcol:last-child::before{right:50%}
.pnode{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#1f2333;border:2px solid #3a3f58;color:var(--muted)}
.pcol.open .pnode{background:var(--gold);border-color:#ffe2a0;color:#1b1406}.pcol.cur .pnode{box-shadow:0 0 0 3px rgba(232,176,74,.35)}
.pcell{position:relative;width:74px;height:74px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font:inherit;font-size:11px;font-weight:800;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);text-align:center;line-height:1.1}
.pcell .rw{flex-direction:column;margin:0;gap:1px}.pcell .rw svg,.pcell .rw img{width:24px;height:24px}
.pcell.prem{background:linear-gradient(160deg,#3a2c12,#1f1a10);border-color:rgba(232,176,74,.55)}
.pcell.can{border-color:var(--good);box-shadow:0 0 12px rgba(79,209,139,.55);animation:pcan 1.6s ease-in-out infinite;cursor:pointer}
.pcell.prem.can{border-color:#ffd98a;box-shadow:0 0 14px rgba(232,176,74,.75)}
@keyframes pcan{50%{transform:translateY(-2px)}}
.pcell.got{opacity:.45}.pcell.lock{filter:grayscale(.35)}
.pck,.plk{position:absolute;right:4px;top:3px;font-style:normal;font-size:12px}.pck{color:var(--good);font-weight:900}
@media (prefers-reduced-motion:reduce){.pcell.can{animation:none}}
.chest.offer{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,176,74,.16),var(--panel2))}
/* Tienda en rejilla: tarjeta con brillo del color del producto, dibujo grande y botón de precio abajo */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.scard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 8px 10px;border-radius:14px;border:1px solid color-mix(in srgb,var(--tone) 45%,var(--line));
  background:radial-gradient(90% 60% at 50% 30%,color-mix(in srgb,var(--tone) 26%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 1px 0 #ffffff10}
.scard .ibtn{position:absolute;top:7px;right:7px;margin:0}
.scard .sc-ic{height:58px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--tone) 55%,transparent))}
.scard .sc-ic .ic{width:50px;height:50px;vertical-align:0}
.scard .sc-stack .ic{width:34px;height:34px;margin:0 -8px}
.scard .sc-stack .ic:nth-child(2){transform:translateY(-8px)}
.scard .sc-n{font-family:var(--display);font-size:15px;line-height:1.15;margin-top:4px}
.scard .sc-s{font-size:11px;color:var(--muted);min-height:15px;line-height:1.3}
.scard .sc-buy{width:100%;margin-top:auto;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px}
.scard .sc-buy .ic{width:15px;height:15px;vertical-align:0}
.scard .sc-s{margin-bottom:8px}
.scard .pill{align-self:center;margin-top:8px}
.scard .sc-tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--good);color:#10231a}
.scard.deal{border-color:var(--good)}
.chest.offer{box-shadow:0 0 0 1px #e8b04a55,0 6px 18px -6px #e8b04a66}
.ibtn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;font-weight:800;font-family:var(--body);padding:0;vertical-align:2px;margin-left:4px}
.ibtn:hover{color:var(--ink);border-color:var(--gold)}
.ibtn{width:24px;height:24px;font-size:12px;position:relative}
.ibtn::after{content:'';position:absolute;inset:-10px;border-radius:50%}
.scard .ibtn{width:28px;height:28px;font-size:13px}
.scard button.sc-ic{background:none;border:0;padding:0;width:100%;cursor:pointer}
.chest .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chest.inv .acts{flex-wrap:nowrap} /* los 3 botones en una línea, alineados entre filas */
.chest.inv>div:first-child{min-width:0}
@media (max-width:374px){.chest.inv{grid-template-columns:1fr}}
.demo{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.6px;text-transform:uppercase}
.tw{overflow-x:auto}
@media (max-width:374px){.calg{grid-template-columns:repeat(3,minmax(0,1fr))}.cald:last-child{grid-column:span 3}}
/* Mercado: lo agotado (hasta el lunes) se ve apagado */
.scard.sold{opacity:.55}
/* pestañas de la Tienda: las 4 en una fila (repartidas a lo ancho) */
.fchips.shtabs{flex-wrap:nowrap}
.fchips.shtabs button{flex:1 1 auto;justify-content:center;padding:4px 6px;min-width:0;white-space:nowrap}
.classes{display:grid;grid-template-columns:1fr;gap:10px} /* una clase por fila: nombre y pasiva */
.ccard{text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.ccard:hover{border-color:var(--gold)}
.ccard .cn{font-family:var(--display);font-size:19px}
.ccard .cs{font-size:12px;color:var(--muted);line-height:1.45}
.pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;text-transform:uppercase;letter-spacing:.5px}
.hero-title{font-family:var(--display);font-size:34px;margin:6px 0 0;line-height:1}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.fchips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--muted)}
.fchips button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
select,input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px}
input[type=number]{width:64px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.item.eq{border-color:var(--gold)}
.item .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.item .nm{font-weight:800;font-size:13px}
.star{background:none;border:0;padding:8px;margin:-8px -4px;font-size:15px;color:var(--muted)}
.star.on{color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .xclose{position:sticky;top:0;align-self:flex-end;flex:none;margin:-6px -6px -38px 0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;z-index:2}
.modal .box h3{padding-right:36px}
.modal .box{position:relative;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.modal h3{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.loot{display:flex;flex-direction:column;gap:6px}
.loot div{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(128px + max(env(safe-area-inset-top,0px),var(--safe-top)));pointer-events:none;background:var(--panel2);border:1px solid var(--gold);padding:8px 14px;border-radius:10px;font-weight:800;font-size:13px;z-index:20;max-width:90%;text-align:center}
/* elegir héroe: tarjetas con su dibujo (2 por fila; la última, centrada) y debajo la elegida con «Empezar» */
.classes2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard2{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 10px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%),var(--panel);color:var(--ink);cursor:pointer}
.ccard2:last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 5px)}

/* HUD del combate (estilo juego de lucha): tu vida a la izquierda, la de los enemigos a la derecha, emblema en el centro */
/* combates especiales: borde de color que brilla, cartel de entrada, etiqueta, barra de horda, reloj y marca de furia */
.stage.enc-boss{--es:.8;--ec:#e5484d;--eg:rgba(229,72,77,.5);--ebd:rgba(70,10,14,.92)}.stage.enc-elite{--es:.8;--ec:#a86be0;--eg:rgba(168,107,224,.5);--ebd:rgba(38,16,60,.92)}
.stage.enc-horde{--es:.8;--ec:#f08a3c;--eg:rgba(240,138,60,.5);--ebd:rgba(70,30,6,.92)}.stage.enc-event{--es:.8;--ec:#4f95e6;--eg:rgba(79,149,230,.5);--ebd:rgba(10,30,62,.92)}
.stage[class*="enc-"]{border-color:var(--ec);animation:encglow 2.2s ease-in-out infinite}
/* el mismo brillo para los cuatro tipos (solo cambia el color) */
@keyframes encglow{0%,100%{box-shadow:0 0 calc(var(--es)*5px) 0 var(--eg),0 0 0 1px var(--ec)}50%{box-shadow:0 0 calc(var(--es)*11px) calc(var(--es)*1px) var(--eg),0 0 0 1px var(--ec)}}
.enc{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:6;font-family:inherit}
/* el mismo brillo por dentro del combate, latiendo a la vez que el de fuera */
.stage[class*="enc-"] .enc{animation:encglowin 2.2s ease-in-out infinite}
@keyframes encglowin{0%,100%{box-shadow:inset 0 0 calc(var(--es)*8px) 0 var(--eg)}50%{box-shadow:inset 0 0 calc(var(--es)*16px) calc(var(--es)*2px) var(--eg)}}
.encban{position:absolute;left:-4%;right:-4%;top:22%;transform:skewY(-4deg);padding:9px 0 11px;text-align:center;background:linear-gradient(90deg,transparent,var(--ebd) 14%,var(--ebd) 86%,transparent);
  border-top:2px solid var(--ec);border-bottom:2px solid var(--ec);box-shadow:0 0 30px var(--eg);animation:encin 1.9s ease forwards}
@keyframes encin{0%{opacity:0;transform:skewY(-4deg) scaleX(.2)}12%{opacity:1;transform:skewY(-4deg) scaleX(1.04)}18%{transform:skewY(-4deg) scaleX(1)}82%{opacity:1}100%{opacity:0;transform:skewY(-4deg) translateY(-10px)}}
.encban small{display:block;font-size:11px;font-weight:900;letter-spacing:.35em;color:var(--ec)}
.encban b{display:block;font-size:clamp(18px,6.4vw,25px);font-weight:900;letter-spacing:.04em;color:#fff;text-transform:uppercase;text-shadow:0 2px 0 #000,0 0 18px var(--eg);padding:0 8%}
.encban i{display:block;font-style:normal;font-size:12px;font-weight:800;color:#e9e2d0;margin-top:2px;padding:0 10%}
.encchips{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}.encchips span{font-size:11px;font-weight:900;padding:3px 8px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid var(--ec);color:#fff}
.enchb{position:absolute;left:50%;top:66px;transform:translateX(-50%);width:72%;padding:6px 10px;border-radius:12px;background:rgba(10,8,16,.82);border:1.5px solid var(--ec);text-align:center;box-shadow:0 0 14px var(--eg)}
.enchb b{font-size:13px;font-weight:900;color:#fff;letter-spacing:.06em}.encpg{height:8px;border-radius:4px;background:#2a2533;margin-top:5px;overflow:hidden}.encpg i{display:block;height:100%;background:linear-gradient(90deg,var(--ec),#ffd08a);transition:width .25s linear}
.enchb small{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#e9e2d0;margin-top:4px}
.stage.encshake{animation:encshake .45s ease,encglow 2.2s ease-in-out infinite}@keyframes encshake{0%,100%{translate:0 0}20%{translate:-5px 2px}40%{translate:5px -2px}60%{translate:-3px 1px}80%{translate:3px 0}}
@media (prefers-reduced-motion:reduce){.stage[class*="enc-"] .enc{animation:none;box-shadow:inset 0 0 calc(var(--es)*10px) 0 var(--eg)}.stage[class*="enc-"],.stage.encshake{animation:none;box-shadow:0 0 calc(var(--es)*8px) 0 var(--eg)}.encban{animation-duration:2.4s}}

.vssh{position:absolute;left:4px;top:25px;height:4px;width:0;max-width:calc(100% - 14px);border-radius:2px;background:linear-gradient(180deg,#d4ecff,#4a95f0);box-shadow:0 0 6px #62b6ff;transition:width .15s}
.vsc{position:relative;z-index:2;width:50px;height:50px;margin:-14px -7px 0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,#343a52,#11131c 70%);border:2px solid #e8b04a;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.7)}
.vsc small{font-family:var(--display);font-weight:800;font-size:8px;letter-spacing:.06em;color:#e8b04a;line-height:1}
.vsc b{font-family:var(--display);font-weight:900;font-size:19px;color:#fff;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.vsc.long b{font-size:10px;letter-spacing:.02em}.vsc.ll small{font-size:6.5px;letter-spacing:0}.vsc svg{display:block;filter:drop-shadow(0 1px 1px #000)}
/* mismos colores que el borde del combate: jefe rojo, élite morado, horda naranja, evento azul */
.vsc.boss{border-color:#e5484d;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 7px rgba(229,72,77,.8);color:#ff7a7d}.vsc.boss small{color:#ff9a9d}
.vsc.eboss,.vsc.elite{border-color:#a86be0;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 7px rgba(168,107,224,.8);color:#c98cff}.vsc.eboss small,.vsc.elite small{color:#d6a8ff}
.vsc.horde{border-color:#f08a3c;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 7px rgba(240,138,60,.8);}.vsc.horde small{color:#ffb56a}
.vsc.wander{border-color:#4f95e6;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 7px rgba(79,149,230,.8);}.vsc.wander small{color:#9cc6ff}
.vsc.pvp small{color:#7cc2ff}
.vsst{display:flex;gap:4px;margin-top:9px;pointer-events:auto;flex-wrap:wrap}.vsw.foe .vsst{justify-content:flex-end}
.sti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1;cursor:help;
  background:radial-gradient(circle at 50% 35%,#343a52,#11131c 75%);border:1.5px solid var(--good);box-shadow:0 1px 3px rgba(0,0,0,.7);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vsw.foe .sti{border-color:var(--bad)}.sti.life{border-color:#ff8a8a;background:radial-gradient(circle at 50% 35%,#5a2630,#1c0f14 75%)}.sti.bad{border-color:var(--bad)}
.skbar .skmode{position:relative;right:auto;bottom:auto;width:40px;height:40px;border-radius:50%;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 50% 35%,#343a52,#11131c 75%);border:2px solid var(--line);color:var(--muted);align-self:center}
.skbar .skmode small{font-size:8px;font-weight:900;letter-spacing:.04em}
.skbar .skmode.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(232,176,74,.45)}
.skbar.many .skmode{width:34px;height:34px}
.invbox .rates{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.rt{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--rc,var(--line));background:var(--panel2);font-variant-numeric:tabular-nums}
.rt b{color:var(--rc,var(--ink))}
.pity{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:8px}
.pity .rbar{height:6px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.pgrid.one{grid-template-columns:1fr;max-width:120px;margin:8px auto}
.ptile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:10px;background:var(--panel2);border:2px solid var(--rc);text-align:center;animation:lootin .35s cubic-bezier(.2,1.4,.4,1) both}
.ptile b{font-size:10px;line-height:1.1;color:var(--rc)}
.ptile small{font-size:9px;color:var(--muted);min-height:11px}
.ptile small.eq{color:var(--good);font-weight:800}
.ptile.hi{box-shadow:0 0 14px -2px var(--rc)}
.ptile.new small:first-of-type{color:var(--gold);font-weight:800}
.wlines{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.wline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--rc)}
.wline.no{opacity:.5}
.wline.eq{outline:1px solid var(--rc)}
.wline .wn{display:flex;flex-direction:column;min-width:0}
.wline .wn b{font-size:12px}
.wline small{font-size:10px;color:var(--muted)}
.wline .wc{font-size:12px;font-weight:800;text-align:right}
.wline .wd{font-size:12px;color:var(--good);min-width:48px;text-align:right;display:flex;flex-direction:column}
.wline .wd small{font-weight:600;white-space:nowrap}
.wfxbox{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--rc);opacity:.75}
.wfxbox.on{opacity:1;outline:1px solid var(--rc)}
.wfxbox b{font-size:12px;color:var(--rc)}
.wfxbox small{font-size:10px;color:var(--muted)}
.wfxbox p{margin:4px 0 0;font-size:11px;line-height:1.35}
.ibslot svg{width:32px;height:32px}
.ibslot.empty .ibl{font-size:9px}
.bslots{flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.bslots .btn.sm{padding:4px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.bslots .btn.sm.on{outline:2px solid var(--gold)}
.gcol .ghead,.gcol .grow{display:grid;grid-template-columns:68px repeat(5,minmax(0,1fr));gap:4px;align-items:center;margin:3px 0}
.gcol .ghead span{font-size:10px;font-weight:800;text-align:center}
.gcol .gname{font-size:11px;font-weight:800}
.gcol .glock{grid-column:2 / 7;font-size:11px;color:var(--muted)}
.gcell{height:24px;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.gcell.has{border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 22%,transparent);color:#fff}
.gcell.eq{outline:2px solid var(--rc)}
.gsets{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.gset{padding:6px 8px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--rc);opacity:.6}
.gset.on{opacity:1}
.gset b{font-size:12px;color:var(--rc)}
.gset small{font-size:10px;color:var(--muted)}
.gset p{margin:2px 0 0;font-size:11px;line-height:1.3}
.gset .act{color:var(--good);font-weight:800}
.flyg{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;border:2px solid var(--rc);background:rgba(10,11,16,.85)}
/* recursos (fase 1): aviso de pieza nueva, pieza elegida en su ventana, botones, colección con nivel, modo romper y Forja */
.ibslot{position:relative}
.newdot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #12141c}
.wline[role="button"]{cursor:pointer}
.wline.sel{background:color-mix(in srgb,var(--rc) 16%,var(--panel2))}
.wline .wc i{font-style:normal;color:#7fd8e8;font-size:11px}
.gacts{flex-wrap:wrap;gap:6px;margin:6px 0}
.gacts .btn .ic,.brkbar .ic,.invforge .ic,.fpiece .ic{width:16px;height:16px;vertical-align:-3px}
.gcell{position:relative}
.gcell small{position:absolute;right:2px;bottom:0;font-size:8px;color:#7fd8e8;font-weight:800}
.gcell[role="button"]{cursor:pointer}
.gcell.mk.all{background:color-mix(in srgb,var(--bad) 45%,transparent);border-color:var(--bad)}
.gcell.mk.extra{box-shadow:inset 0 0 0 2px var(--bad)}
button.rt{cursor:pointer;color:var(--ink);font:inherit;font-size:12px}
.rt.on{outline:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 18%,var(--panel2))}
.brkbar{margin:6px 0 8px;padding:8px;border-radius:8px;background:var(--panel2);border:1px solid var(--bad)}
.brkbar .ctrl{flex-wrap:wrap;gap:6px;align-items:center}
.brklist{margin:6px 0;padding-left:18px;font-size:12px;line-height:1.4;max-height:160px;overflow:auto}
.fpiece{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--rc);margin-bottom:8px}
.fpiece span{display:flex;flex-direction:column}.fpiece b{font-size:12px;color:var(--rc)}.fpiece small{font-size:10px;color:var(--muted)}
/* Talentos (dentro del Grimorio): una fila por talento con su nivel, lo que da y el botón de subir */
.tals{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.tals h4{margin:0;font-size:14px;color:var(--rE)}
.tals.off{opacity:.65}
.tal{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tal:last-child{border-bottom:0}
.tal .btn{white-space:nowrap;flex:none}
/* ---------- estilo RPG (rediseño): marcos pintados de hierro y bronce; el oro brillante solo en lo elegido y el botón principal ----------
   Marcos en sprites/ui (9 partes con border-image, corte de 48 px): marco_dorado (oro viejo desgastado del kit de las maquetas: casi todo) y marco_oro (lo elegido).
   Dentro de los paneles, la pizarra rayada del kit (losa) con un degradado suave. */
:root{--fr-h:url(sprites/ui/marco_dorado.webp);--fr-b:url(sprites/ui/marco_dorado.webp);--fr-o:url(sprites/ui/marco_oro.webp);
  --plate:linear-gradient(180deg,rgba(46,50,70,.28),rgba(0,0,0,.4)),url(sprites/ui/losa.webp) center/cover,#11131b;--cream:#efe2c2}
body{background:radial-gradient(ellipse 120% 70% at 50% 0%,#161a28,#0b0c12 70%) fixed,#0b0c12}
/* marcos */
.panel,.mrow,.cald,.scard,.modal .box,.mcard2,.stage,.ihero{border:12px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 12px stretch;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.panel,.mrow,.cald,.scard,.modal .box{background:var(--plate);background-clip:padding-box}
.mcard2,.ihero{border-image-source:var(--fr-b)}
.panel{padding:8px}
.mrow{padding:4px 5px;border-width:10px;border-image-width:10px}
/* un panel que ya lleva filas o tarjetas enmarcadas no lleva marco propio (sin marcos dentro de marcos) */
.panel:has(> .mrow,> .scard,> .sgrid,> .mcard2,> .mlist){border:0;border-image:none;background:none;box-shadow:none;padding:0}
.cald.now,.scard.on{border-image-source:var(--fr-o)}
.cald.now{box-shadow:0 0 14px rgba(232,176,74,.35)}
/* cabecera: medallón con el icono de la pantalla, título y monedas en placas */
.top.slim{background:linear-gradient(180deg,#0b0c12 75%,transparent)}
.top.slim .sttl{display:flex;align-items:center;gap:6px;font-size:15px;letter-spacing:.6px;color:var(--cream);text-shadow:0 2px 0 #000}
.sttl .stxt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sttl .smed{flex:none;width:34px;height:34px;display:grid;place-items:center;background:url(sprites/ui/aro_hierro.webp) center/100% 100% no-repeat}
.sttl .smed .uimg{width:22px;height:22px}
.top.slim .res span,.top .res span{border:7px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 7px stretch;background:var(--plate);background-clip:padding-box;padding:1px 6px 1px 2px}
.gear{border:7px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 7px stretch;background:var(--plate);background-clip:padding-box;width:40px;height:40px}
/* pestañas: placa oscura sencilla; la elegida, marco de oro */
.fchips button{border:6px solid transparent;border-radius:0;border-image:none;background:#141622;background-clip:padding-box;padding:2px 7px;color:#9a97a6;box-shadow:inset 0 0 0 1px #2c2c38}
.fchips button[aria-pressed="true"]{border-image:var(--fr-o) 48 / 6px stretch;background:linear-gradient(180deg,#2a2210,#14110a);background-clip:padding-box;color:var(--cream);box-shadow:0 0 10px rgba(232,176,74,.25)}
/* botones: el normal, placa de hierro; el dorado, placa de oro apagado (sin brillo) */
.btn:not(.gold){border:7px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 7px stretch;background:var(--plate);background-clip:padding-box;padding:4px 10px;color:var(--cream)}
.btn.gold{border:1px solid #6b4a14;border-radius:8px;background:linear-gradient(#e2b25a,#b9862d);color:#1b1406;box-shadow:0 2px 0 #5a3c0e,inset 0 1px 0 rgba(255,240,200,.35)}
/* barra de abajo: la barra entera es una franja (con su línea morada de arriba); los botones, sin caja; el elegido, marco de oro con brillo suave */
.nav{background:linear-gradient(180deg,#12141e,#08090d)}
.nav div{gap:4px}
.nav button{border:7px solid transparent;border-radius:0;background:none;padding:1px 0 2px;color:#8f8c9c}
.nav button[aria-selected="true"]{border-image:var(--fr-o) 48 / 7px stretch;background:linear-gradient(180deg,#2a2210,#14110a);background-clip:padding-box;color:var(--cream);box-shadow:0 0 12px rgba(232,176,74,.3)}
/* pestañas del inventario: franja de hierro; la elegida, marco de oro */
.isubs{border:7px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 7px stretch;background:var(--plate);background-clip:padding-box;padding:2px}
.isubs button{border:5px solid transparent;border-radius:0;padding:3px 2px}
.isubs button.on{border-image:var(--fr-o) 48 / 5px stretch;border-radius:0;background:linear-gradient(180deg,#2a2210,#14110a);background-clip:padding-box;color:var(--cream)}
/* insignias de las tarjetas: placa oscura con borde fino (sin rojo ni dorado chillón) */
.mbadge{background:#0e0f16e6;border:1px solid #7a6a4a;color:var(--cream)}
.mbadge.g{border-color:#7a6a4a;color:#d9c79a}
/* ---------- maquetación de cada pantalla con el estilo RPG (según las maquetas): Modos, Misiones, Tienda y Premios diarios ---------- */
/* pestañas: ocupan todo el ancho, cada una lo que necesita */
.fchips{display:flex;gap:4px}
.fchips button{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* placa oscura con borde fino (datos dentro de las tarjetas) */
.mcard2 .mp,.mcard2 .mf{background:#0b0c12d9;border:1px solid #5e5038;border-radius:6px}
/* Modos: progreso en recuadro; dificultades en placas de su color (la de ahora, encendida); datos en placa */
.mcard2 .mp{padding:4px 10px}
.mcard2 .mm{gap:6px;margin-top:2px}
.mcard2 .mm span{padding:2px 8px;border:1px solid currentColor;border-radius:6px;background:#0b0c12d9;opacity:.6}
.mcard2 .mm span:nth-child(1){color:#8fb3e8}
.mcard2 .mm span:nth-child(2){color:#7fd08a}
.mcard2 .mm span:nth-child(3){color:#ff6b6b}
.mcard2 .mm span.on{opacity:1;box-shadow:0 0 8px -2px currentColor}
.mcard2 .mf{align-self:stretch;padding:3px 10px}
.mcard2.low .mf{display:table;align-self:auto;margin-top:5px}
.mcard2 .mico{width:58px;height:58px;border:0;background:url(sprites/ui/aro_hierro.webp) center/100% 100% no-repeat}
.mcard2 .mico .mimg{width:38px;height:38px}
/* Misiones: retrato a la izquierda, barra verde, premios en placas */
.mpor{flex:none;width:50px;height:50px;display:grid;place-items:center;background:#0a0b10;border-radius:4px;box-shadow:inset 0 0 0 1px #3a3442,inset 0 0 12px #000}
.mpor .uimg{width:38px;height:38px}
.mrow .mbar .rbar{height:9px;border-radius:5px;overflow:hidden}
.mrow .mbar .rbar i,.mrow.ready .mbar .rbar i{background:linear-gradient(90deg,#3f9a4c,#7ed35f)}
.mrow .mrw .rw{background:#0a0b10;border:1px solid #2e2a36;border-radius:6px}
.mrow.ready{background:var(--plate);background-clip:padding-box;border-image-source:var(--fr-o)}
/* Tienda: 3 columnas; el precio en placa oscura con marco de bronce (sin botón dorado) */
.sgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.scard{border-width:10px;border-image-width:10px;padding:4px 2px 5px}
.scard .sc-ic{height:50px;background:radial-gradient(circle,color-mix(in srgb,var(--tone) 30%,transparent) 0,transparent 68%)}
.scard .sc-ic .ic{width:44px;height:44px}
.scard .sc-n{font-size:13px}
.scard .sc-s{font-size:10px;margin-bottom:6px}
.scard .sc-buy.btn.gold{border:6px solid transparent;border-image:var(--fr-b) 48 / 6px stretch;border-radius:0;background:#0d0e15;background-clip:padding-box;color:var(--cream);box-shadow:none;padding:1px 2px;font-size:12px;gap:3px;overflow:hidden}
.scard .sc-buy.btn.gold:disabled{opacity:.5}
.scard .ibtn{top:2px;right:2px;width:22px;height:22px;font-size:11px}
@media (max-width:359px){.sgrid{grid-template-columns:1fr 1fr}}
/* Premios diarios: cabecera con el cofre; cada día, el premio grande en el centro */
.dhead{display:flex;align-items:center;gap:10px;margin:0 30px 10px 0}
.dhead .uimg{flex:none;width:54px;height:54px}
.dhead h3{margin:0;font-size:18px;color:var(--cream);letter-spacing:.3px;white-space:nowrap}
.dhead small{display:block;font-size:12px;color:#b3aebf;line-height:1.3}
.cald{align-items:center;justify-content:flex-start;gap:5px;padding:3px 1px;min-height:72px;border-width:9px;border-image-width:9px}
.cald .s{font-weight:800;color:var(--cream)}
.cald b{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px}
.cald .rw{flex-direction:column;gap:1px;margin:0;font-size:12px}
.cald .rw .ic,.cald .rw img,.cald .rw svg{width:26px;height:26px}
.cald.got{opacity:.6}
.cald .rmax{color:#7ed35f;font-weight:900}
/* Tienda: «desde» pequeño para que quepa el precio */
.scard .sc-buy small{font-size:9px;opacity:.8}
/* Potenciadores (como su maqueta): cada ventaja en un panel enmarcado con medallón, título, duración y explicación; a la derecha, el botón y cuántas quedan */
.brow{display:flex;align-items:center;gap:8px;padding:6px 4px;margin-bottom:8px;border:11px solid transparent;border-image:var(--fr-h) 48 / 11px stretch;background:var(--plate);background-clip:padding-box}
.bmed{flex:none;width:56px;height:56px;display:grid;place-items:center;background:url(sprites/ui/aro_dorado.webp) center/100% 100% no-repeat}
.bmed .uimg{width:34px;height:34px}
.brow .bt{flex:1;min-width:0}
.brow .t{font-family:var(--display);font-weight:700;font-size:16px;color:#f0d79a;line-height:1.15}
.brow .bd{font-size:12px;font-weight:800;color:#e8c46a;margin-top:2px}
.brow .bx{font-size:11px;color:#a8a3b3;line-height:1.3;margin-top:2px}
.brow .acts{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.brow .acts .btn{font-size:12px;padding:6px 8px}
.brow .acts .s{font-size:10.5px;color:#a8a3b3;text-align:center}
/* Inventario, al estilo de la ficha de personaje de los MMO: el héroe en el centro sobre su pedestal y los huecos enmarcados a los lados */
.ihero{padding:8px 8px 10px;gap:4px;background-color:#0c0d14}
.ihname{padding:3px 18px;background:#0b0c12d9;border:1px solid #5e5038;border-radius:6px}
.ihname b{font-size:16px;color:var(--cream)}
.ihname span{font-size:10px;color:#d9c79a}
.ihgrid{grid-template-columns:64px 1fr 64px;max-width:340px}
.ihcol{gap:10px}
.ihs{display:flex;flex-direction:column;align-items:center;gap:2px}
.ihs>small{font-size:10px;font-weight:800;color:#b3aebf;letter-spacing:.3px;text-shadow:0 1px 2px #000}
.ihero .ibslot{width:58px;height:58px;border:7px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 7px stretch;background:#0a0b10;background-clip:padding-box;box-shadow:inset 0 0 0 2px var(--rc,#3a3442),inset 0 0 14px #000,0 4px 8px rgba(0,0,0,.6)}
.ihero .ibslot.empty{border-style:solid;box-shadow:inset 0 0 0 1px #2e2a36,inset 0 0 14px #000}
.ihero .ibslot svg,.ihero .ibslot .bimg{width:34px;height:34px}
.ihero .ibslot .ilock{width:26px;height:26px;opacity:.7}
.ihero .ibslot .ibl{bottom:-3px;right:-3px;padding:0 4px;background:#0b0c12;border:1px solid #5e5038;border-radius:4px;color:var(--cream);font-size:9px}
.ihart{position:relative;min-height:150px}
.ihart img{position:relative;width:126px}
.ihped{position:absolute;left:50%;bottom:4px;width:120px;height:26px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(150,90,255,.35),rgba(0,0,0,.65) 55%,transparent 72%)}
.ihgrim{margin-top:-4px}

.ihstats span{display:flex;flex-direction:column;align-items:center;gap:0;padding:3px 2px;background:#0b0c12d9;border:1px solid #2e2a36;border-radius:6px}

/* ---------- más cerca de las maquetas: letra con serifa, pestañas con icono, cabecera con estandarte y barra de abajo en cajas ---------- */
:root{--display:"Cinzel",Georgia,"Times New Roman",serif}
.sttl .stxt,.mcard2 .mt,.mcard2 .mk,.scard .sc-n,.dhead h3,.modal h3,.panel h3,.fchips button,.isubs button,.nav .nl,.btn,.ihname b,.ihs>small,.mbadge,.cald .s{font-family:var(--display);font-weight:700}
.mcard2 .mt{font-weight:900;font-size:26px;color:#f3e3c0}
.dhead h3,.modal h3{color:#f0d79a}
/* cabecera: el título en un estandarte del kit y el medallón con aro de oro */
.top.slim .sttl{gap:0}
.sttl .smed{width:44px;height:44px;margin-right:-10px;position:relative;z-index:1;background-image:url(sprites/ui/aro_dorado.webp)}
.sttl .smed .uimg{width:28px;height:28px}
.sttl .stxt{padding:6px 13px 6px 15px;background:url(sprites/ui/banner.webp) center/100% 100% no-repeat;color:#f0d79a;font-size:13px;font-weight:900;letter-spacing:.4px}
.top.slim .res{gap:4px}
.gear{border-image-source:var(--fr-h)}
/* pestañas: caja con marco, icono encima del nombre; la elegida, oro vivo con brillo */
.fchips button,.isubs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px;font-size:11px;line-height:1.1;border:6px solid transparent;border-image:var(--fr-h) 48 / 6px stretch;background:#10121a;background-clip:padding-box;color:#a8a3b3;box-shadow:none}
.fchips button .uimg,.isubs button .uimg{width:20px;height:20px;filter:saturate(.6) brightness(.85)}
.fchips button[aria-pressed="true"],.isubs button.on{border-image:var(--fr-o) 48 / 6px stretch;background:linear-gradient(180deg,#2b2312,#15110a);background-clip:padding-box;color:#f3e3c0;box-shadow:0 0 12px rgba(232,176,74,.35)}
.fchips button[aria-pressed="true"] .uimg,.isubs button.on .uimg{filter:none}
.isubs{border:0;border-image:none;background:none;padding:0;gap:4px}
.fchips .nb,.isubs .nb{position:absolute!important;top:-6px;right:-4px}
.fchips button{position:relative;overflow:visible}
/* barra de abajo: cada botón en su caja con marco; el elegido, oro vivo con brillo y un rombo encima */
.nav button{border:7px solid transparent;border-image:var(--fr-h) 48 / 7px stretch;background:#10121a;background-clip:padding-box;overflow:visible}
.nav button[aria-selected="true"]::after{content:"";position:absolute;top:-11px;left:50%;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#ffe2a0,#c48a2c);box-shadow:0 0 8px rgba(255,200,90,.8);border:1px solid #5a3c0e}
/* botones normales: placa oscura con marco de oro viejo */
.btn:not(.gold){border-image-source:var(--fr-h);color:#f0e2c4}
/* insignias de las tarjetas: placa con borde de oro viejo */
.mbadge,.mbadge.g{border-color:#a07a3a;color:#f0d79a;font-weight:700}
/* separadores del kit bajo los títulos de las ventanas */
.dhead{padding-bottom:10px;background:url(sprites/ui/separador.webp) center bottom/90% 10px no-repeat}
.mrow .mi>b{font-size:13.5px;color:#f0e2c4}
/* ---------- Inicio (como su maqueta): fase en un escudo, barras con borde de oro viejo, botones del combate en marcos y mejoras en cajas con icono ---------- */
.vsc{width:58px;height:60px;margin:-12px -10px 0;border:0;border-radius:0;background:url(sprites/ui/emblema.webp) center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));padding-top:4px}
.vsc small{color:#f0d79a}
.vsc.boss,.vsc.eboss,.vsc.elite,.vsc.horde,.vsc.wander{box-shadow:none}
.vsc.boss{filter:drop-shadow(0 0 6px rgba(229,72,77,.9))}
.vsc.eboss,.vsc.elite{filter:drop-shadow(0 0 6px rgba(168,107,224,.9))}
.vsc.horde{filter:drop-shadow(0 0 6px rgba(240,138,60,.9))}
.vsc.wander{filter:drop-shadow(0 0 6px rgba(79,149,230,.9))}
.vsv .frm{stroke:#c9a052;stroke-width:2.6}
@keyframes vslow{from{stroke:#c9a052}to{stroke:#ff4d45}}
.av{border-color:#c9a052;box-shadow:0 0 0 2px #0b0c10,0 0 0 4px #6b5228}
/* premios, poción y repetir: abajo a la derecha, en fila y con marco */
.sidebtns{top:auto;bottom:14px;right:12px;flex-direction:row-reverse;gap:6px}
.sidebtns .calbtn{width:46px;height:46px;border:6px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 6px stretch;background:#0c0d15d9;background-clip:padding-box}
.sidebtns .calbtn .bimg{width:30px;height:30px}
.sidebtns .boosttime{right:auto;left:50%;top:auto;bottom:calc(100% + 4px);transform:translateX(-50%)}
/* habilidad y AUTO con aro de oro */
.skb{border:3px solid #c9a052;box-shadow:0 0 0 2px #0b0c10,0 3px 8px rgba(0,0,0,.6)}
.skbar .skmode{width:48px;height:48px;border:0;background:url(sprites/ui/aro_dorado.webp) center/100% 100% no-repeat,#0c0d15;border-radius:50%}
.skbar .skmode.on{box-shadow:0 0 10px rgba(232,176,74,.5)}
/* mejoras: cajas con marco, icono, nombre, nivel y precio */
.upt,.upx{border:6px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 6px stretch;background:#0c0d15;background-clip:padding-box;flex-direction:column;align-items:center;row-gap:0;padding:1px 1px 2px}
.upt.ok{border-image-source:var(--fr-h);box-shadow:none}
.upt .upi,.upx .upi{width:16px;height:16px}
.upt .un{color:#b3aebf}
.upt b,.upx b{color:#f3e3c0;font-size:14px}
.upx.lv{background:#0c0d15;background-clip:padding-box}
.upx small{font-size:9px;color:#b3aebf}
/* el escenario del combate, sin marco y de borde a borde (como la maqueta) */
.app.home .stage{border:0;border-image:none;border-radius:0;margin-inline:-16px;box-shadow:none}
.upstrip{grid-template-columns:repeat(5,minmax(0,1fr))}
.vsc small{font-size:8px;margin-bottom:-1px}
.vsc.sk svg{width:22px;height:22px}
/* Inventario, tabla de equipo (como la maqueta): cada pieza en una casilla cuadrada con marco; la que tienes, con su dibujo, el color de su rareza y el +nivel */
.gcol .ghead,.gcol .grow{grid-template-columns:64px repeat(5,minmax(0,1fr));gap:5px;margin:4px 0}
.gcol .ghead span{font-family:var(--display);font-size:10px}
.gcol .gname{font-family:var(--display);font-size:11px;color:#e6d6b0}
.gcell{height:auto;aspect-ratio:1;border:5px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 5px stretch;background:#0a0b10;background-clip:padding-box;box-shadow:inset 0 0 8px #000;opacity:.75}
.gcell.has{opacity:1;border-style:solid;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 28%,#0a0b10),#0a0b10 78%);background-clip:padding-box;box-shadow:inset 0 0 0 2px var(--rc)}
.gcell.eq{outline:0;box-shadow:inset 0 0 0 2px var(--rc),0 0 9px -1px var(--rc)}
.gcell svg{width:24px;height:24px}
.gcell .gl{position:absolute;right:-5px;bottom:-5px;padding:0 3px;border-radius:3px;background:var(--rc);color:#0c0d12;font-size:9px;font-weight:900;line-height:13px}
.gcell small{left:-3px;right:auto;bottom:-4px}
.gcol .glock{display:flex;align-items:center;gap:6px}
.gcol .glock .uimg{width:18px;height:18px}
/* iconos pintados: AUTO, insignias de Modos, tarjetas de Mazmorra y Jefe semanal, candados */
.skbar .skmode{background:#0c0d15;gap:0}
.skbar .skmode .uimg{width:40px;height:40px;margin-top:-2px}
.skbar .skmode small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);padding:0 4px;background:#0b0c12;border:1px solid #a07a3a;border-radius:4px;font-family:var(--display);color:#f0d79a}
.skbar .skmode:not(.on) .uimg{filter:grayscale(.8) brightness(.7)}
.mbadge{display:inline-flex;align-items:center;gap:4px}
.mbadge .bi{width:15px;height:15px}
.evcard{display:grid;grid-template-columns:62px 1fr;column-gap:10px;row-gap:3px;align-items:center;border:12px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 12px stretch;background:var(--plate);background-clip:padding-box;padding:6px 8px}
.evcard>.evic{grid-row:1 / span 3;width:62px;height:62px;display:grid;place-items:center}
.evcard>.evic .uimg{width:58px;height:58px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.evcard .evt{font-family:var(--display);color:#f0d79a}
.evcard .evlk{width:18px;height:18px;vertical-align:-3px}
.htile .hlk .uimg{width:30px;height:30px;opacity:.75}
.back{border:8px solid transparent;border-radius:0;border-image:var(--fr-h) 48 / 8px stretch;background:var(--plate);background-clip:padding-box;font-family:var(--display);font-weight:700;color:#f0d79a;padding:2px 10px}
.panel:has(> .evcard){border:0;border-image:none;background:none;box-shadow:none;padding:0}
/* Potenciadores: medallón a la izquierda; a la derecha el texto y, debajo, el botón con cuántas quedan */
.brow{display:grid;grid-template-columns:56px 1fr;column-gap:10px;row-gap:6px;align-items:center}
.brow .bmed{grid-row:1 / span 2}
.brow .acts{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
/* cabecera: «+» junto al oro y los tokens (lleva a la Tienda) y el nivel bajo el nombre */
.res span{display:inline-flex;align-items:center}
.res .rplus{flex:none;width:15px;height:15px;margin:0 -2px 0 4px;padding:0;border:1px solid #5a3c0e;border-radius:50%;background:radial-gradient(circle at 50% 35%,#f0c56a,#a8761f);color:#1b1406;font:900 12px/13px var(--body);display:grid;place-items:center;cursor:pointer}
.uname .nlv{align-self:flex-start;margin-top:2px;padding:0 6px;border:1px solid #6b5228;border-radius:4px;background:#0b0c12;color:#d9c79a;font:700 10px/14px var(--body)}
/* cabecera más compacta para que quepan el título y los «+» */
.top.slim{gap:5px}
.top.slim .res span,.top .res span{border-width:5px;border-image-width:5px;padding:1px 3px 1px 1px}
.gear{width:36px;height:36px}
.sttl .smed{margin-right:-12px}
.sttl .stxt{padding:6px 9px 6px 14px;font-size:12px;letter-spacing:0}
/* el título de la pantalla siempre entero (nunca «TIE…»): no se recorta; en móviles estrechos, letra y placas algo más pequeñas */
.top.slim .sttl{overflow:visible}
.sttl .stxt{flex:none;overflow:visible;text-overflow:clip;white-space:nowrap}
@media (max-width:374px){.sttl .stxt{font-size:11px;padding:5px 7px 5px 13px}.sttl .smed{width:38px;height:38px}.top.slim .res span{font-size:12px}.res .rplus{width:13px;height:13px;font-size:10px;line-height:11px}.gear{width:32px;height:32px}}
/* Modos con las ilustraciones de la maqueta: tarjetas más altas y títulos grandes */
.mcard2{min-height:190px;background-position:center 30%}
.mcard2.wide{min-height:180px}
.mcard2.wide.low{min-height:118px;background-position:center}

.mcard2 .mico{width:70px;height:70px;background-image:url(sprites/ui/aro_dorado.webp)}
.mcard2 .mico .mimg{width:44px;height:44px}
/* ---------- más cerca de las maquetas (2.ª tanda) ---------- */
/* estandarte con ilustración arriba de Premios diarios y Potenciadores: el personaje sale por encima del borde */
.dban{position:relative;display:flex;align-items:center;min-height:92px;margin:-4px 26px 10px 0;padding-left:47%;background:url(sprites/ui/separador.webp) right bottom/58% 10px no-repeat}
.dban-art{position:absolute;left:-14px;bottom:2px;width:50%;max-width:210px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));pointer-events:none}

.cald .cbig{width:34px;height:34px;margin:-2px 0 -4px}
.cald.now{box-shadow:0 0 16px rgba(255,190,80,.5)}
/* Misiones: «✓ Recoger» oscuro con marco de oro brillante; «Ir ›» con marco */
.mrow .mclaim.btn.gold{border:7px solid transparent;border-image:var(--fr-o) 48 / 7px stretch;border-radius:0;background:#14110a;background-clip:padding-box;color:#f3d48a;box-shadow:0 0 12px rgba(255,190,80,.45)}
.mrow .mgo{min-width:60px}
.mrow .mi>b{font-family:var(--display);font-weight:700}
/* fondo ilustrado detrás de la cabecera (Misiones: el castillo; Tienda: las antorchas de la arena) */
body[data-tab="mis"] .top.slim,body[data-tab="shop"] .top.slim{background:linear-gradient(180deg,rgba(11,12,18,.25),#0b0c12 96%),var(--cab) center 35%/cover no-repeat}
body[data-tab="mis"]{--cab:url(sprites/ui/modo_bg_campana.webp)}
body[data-tab="shop"]{--cab:url(sprites/ui/modo_bg_pvp.webp)}
/* Tienda: dibujo grande con brillo, nombre, descripción y precio en placa enmarcada */
.scard{padding-top:2px}
.scard .sc-ic{height:66px;background:none}
.scard .scart{width:74px;height:66px;object-fit:contain;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--tone) 55%,transparent))}
.scard .sc-n{font-size:14px;color:#f0e2c4}

/* pestañas: icono al lado del nombre (como las maquetas) */
.fchips button,.isubs button{flex-direction:row;justify-content:center;gap:4px;padding:5px 3px;font-size:11.5px}
.fchips button .uimg,.isubs button .uimg{width:18px;height:18px;flex:none}
.dban{padding-left:43%}
.dban-art{width:46%}
.dban-t h3{font-size:18px;white-space:nowrap;letter-spacing:-.2px}
.dban{margin-right:34px}
.fchips{flex-wrap:nowrap}
@media (max-width:374px){.fchips button,.isubs button{font-size:10px;gap:2px;padding:5px 2px}.fchips button .uimg,.isubs button .uimg{width:14px;height:14px}.dban-t h3{font-size:16px}}
/* la letra Cinzel solo tiene mayúsculas: los títulos de las misiones van con la letra normal, que se lee mejor */

@media (max-width:374px){.shtabs button .uimg{display:none}}

:root{--navy:#131c33;--navy2:#0c1324;--navy-ink:#a9b6d8;

.clhead b{display:block;font-size:18px;overflow-wrap:anywhere}
.clhead .s{display:block;overflow-wrap:anywhere}
.fchips.cltabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px}
.fchips.cltabs button{justify-content:center;text-align:center;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clin{flex:1;min-width:0;width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font:inherit;font-size:14px;margin:4px 0}
.clchk{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.cllist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.clrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.clrow.me{border-color:var(--gold)}
.clrow>div:first-child{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.clrow .s{overflow-wrap:anywhere}
.clrow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.clrole{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.clrole.leader{color:var(--gold);border-color:var(--gold)}
.clrole.officer{color:#8fc3ff;border-color:#8fc3ff}
.clbar{position:relative;height:22px;border-radius:11px;background:#0008;border:1px solid var(--line);overflow:hidden;margin:8px 0}
.clbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#9b2a26,#e8673a)}
.clbar.g i{background:linear-gradient(90deg,#2a7d50,#5fd08a)}
.clbar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:22px;text-shadow:0 1px 2px #000;white-space:nowrap}
.clchat{display:flex;flex-direction:column;gap:5px;max-height:50vh;overflow-y:auto;margin:8px 0;padding:2px}
.clmsg{position:relative;align-self:flex-start;max-width:86%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 28px 6px 10px;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.clmsg.me{align-self:flex-end;background:#22345a}
.clmsg b{display:block;font-size:11px;color:var(--gold)}
.clx{position:absolute;top:3px;right:3px;background:none;border:0;font-size:13px;padding:2px;opacity:.75;cursor:pointer}

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>/* Telegram: avisa de que la app está lista y la abre a pantalla completa */
try{ const tg=window.Telegram&&Telegram.WebApp; if(tg&&tg.initData!==undefined){ tg.ready(); tg.expand(); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } }catch(e){}</script>
<div id="boot" class="boot" role="status"><b>Idle Ascension</b><span id="bootMsg">Cargando…</span></div>
<script>
/* Pantalla de carga: comprueba si hay una versión más nueva publicada (version.json, sin usar la memoria del teléfono).
   Si la hay, recarga con los archivos nuevos; si no (o sin conexión), carga el juego. Cada archivo lleva ?v=versión,
   así Telegram no puede usar una copia vieja. En local (versión DEV) no comprueba nada. */
(function(){
  var APP_VERSION='202610210936-776c130';                                      // tools/publicar.sh pone aquí la versión publicada
  var FILES=['config.js','engine.js','telemetry.js','control.js','tonpay.js','art.js','ui.js'];
  window.APP_VERSION=APP_VERSION;
  function load(i){ if(i>=FILES.length){ var b=document.getElementById('boot'); if(b) b.remove(); return }
    var s=document.createElement('script'); s.src=FILES[i]+(APP_VERSION==='DEV'?'':'?v='+APP_VERSION); s.charset='utf-8';
    s.onload=function(){ load(i+1) }; s.onerror=function(){ document.getElementById('bootMsg').textContent='No se pudo cargar. Revisa tu conexión.' };
    document.body.appendChild(s) }
  if(APP_VERSION==='DEV'||!window.fetch) return load(0);
  // Primero config.js (de ahí sale la dirección del servidor); luego se comprueban versión y mantenimiento; luego el resto
  var s0=document.createElement('script'); s0.src=FILES[0]+'?v='+APP_VERSION; s0.charset='utf-8'; s0.onerror=function(){ load(0) };
  s0.onload=function(){ var done=false, go=function(){ if(!done){ done=true; checkMaint() } };
    setTimeout(go,3000);                                      // sin respuesta en 3 s: sigue con lo que hay
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json() }).then(function(j){
      if(done) return;
      var key='upd_'+j.v, tried=false; try{ tried=sessionStorage.getItem(key) }catch(e){}
      if(j&&j.v&&j.v!==APP_VERSION&&!tried){                 // hay versión nueva: recarga (una sola vez, para no entrar en bucle)
        done=true; try{ sessionStorage.setItem(key,'1') }catch(e){}
        document.getElementById('bootMsg').textContent='Actualizando…';
        var u=new URL(location.href); u.searchParams.set('v',j.v); location.replace(u.toString());  // conserva los datos de Telegram (#…)
      } else go();
    }).catch(go); };
  document.body.appendChild(s0);
  // Mantenimiento ANTES de entrar: si está activo, se queda en esta pantalla y mira cada 15 s; al quitarlo, entra.
  // El resultado se deja en window.BOOT_CONTROL para que control.js no repita la consulta.
  function checkMaint(){ var url=window.CFG&&CFG.server&&CFG.server.url; if(!url) return load(1);
    var ok=false, t=setTimeout(function(){ if(!ok){ ok=true; load(1) } },3000);   // sin respuesta en 3 s: entra
    fetch(url,{cache:'no-store'}).then(function(r){ return r.ok?r.json():null }).then(function(c){ if(ok) return; ok=true; clearTimeout(t);
      if(c&&c.mantenimiento){ var b=document.querySelector('#boot b'); b.textContent='En mantenimiento';
        document.getElementById('bootMsg').textContent=String(c.mensaje||'Vuelve en unos minutos.');
        setTimeout(function(){ location.reload() },15000); }
      else { window.BOOT_CONTROL=c; load(1) }
    }).catch(function(){ if(!ok){ ok=true; clearTimeout(t); load(1) } }) }
})();
</script>
