<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idle Ascension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- la fuente no bloquea el arranque: si tarda o falla, se usa la del sistema -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme: dark;
  --bg:#12141c; --panel:#1b1e2a; --panel2:#232738; --line:#2f3448;
  --ink:#ece7da; --muted:#9a9fb3; --gold:#e8b04a; --gold-ink:#1b1406;
  --good:#6cc47a; --bad:#e2605a; --tok:#7fc8e8; --scrap:#c9a27e;
  --rC:#a3a8b4; --rU:#62c275; --rR:#4f95e6; --rE:#b066e8; --rL:#f2912f; --rM:#ff4f79;
  --display:var(--body);
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
.boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg)}
.boot b{font-family:var(--display);font-size:26px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.boot span{color:var(--muted);font-size:13px}
.equip-in{display:flex;gap:12px;align-items:center}
.silh{flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.eslots{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.eslot{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
.eslot b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eslot.empty{border-style:dashed;opacity:.8}
.mbig{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:18px 16px;gap:6px}
.mbig b{font-size:18px}
#syncBox{z-index:150;text-align:center;padding:0 24px}
#ctlBox{z-index:200;text-align:center;padding:0 24px} /* cartel de mantenimiento/actualización: por encima de todo */
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:10px 90px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.uname{font-family:var(--display);font-weight:800;font-size:16px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebox{display:flex;flex-direction:column;gap:4px}
#pNameIn,.nameinp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.fase{font-family:var(--display);font-size:20px;letter-spacing:.5px}
.fase small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:0;margin-left:6px}
.res{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-weight:800}
.res span{display:flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ic{width:15px;height:15px;flex:none}
[hidden]{display:none!important}
.battle{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;border-radius:14px;overflow:visible;border:1px solid var(--line);background:#0e1017;margin-bottom:1px} /* visible: las calaveras y la fase salen unos píxeles por debajo del borde */
canvas{border-radius:13px}
canvas{display:block;width:100%;height:300px}
.app.home{height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app.home .battle{flex:1;min-height:0}
.app.home .stage{flex:1;min-height:clamp(140px,32vh,260px)} /* en pantallas bajas (Telegram compacto) el escenario encoge y los botones no tapan al héroe */
.app.home canvas{position:absolute;inset:0;height:100%}
.app.home #tab{display:none}
.app.home{padding-top:24px}
.app.home .battle{padding-bottom:58px}
.stage .tag{position:absolute;left:10px;top:8px;font-family:var(--display);font-size:13px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.45)}
.stage .tag.boss{background:var(--bad);color:#fff}
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hero .name{font-family:var(--display);font-size:17px}
.hero .name em{font-style:normal;color:var(--muted);font-family:var(--body);font-size:12px;margin-left:6px}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;grid-column:1 / -1}
.bar i{display:block;height:100%;background:var(--good);width:0%}
.bar.xp i{background:var(--tok)}
.hbar{grid-column:1 / -1;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbar .bar{grid-column:auto}
.hbar b{color:var(--ink);min-width:44px;text-align:right}
.statline{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.statline b{color:var(--ink);font-weight:800}
#hStats{flex-direction:column;gap:4px}
#hStats .sl{display:flex;flex-wrap:wrap;gap:4px 12px}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.on{border-color:var(--gold);color:var(--gold)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--display);font-weight:600;font-size:17px}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:800}
.s{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav div{display:flex;gap:2px;max-width:520px;width:100%}
.nav button{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:10px 2px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted)}
.nav button[aria-selected="true"]{background:var(--panel2);color:var(--gold)}
.wcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.wcard.eq{border-color:var(--gold)}
.wcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.wcard .nm{font-weight:800}
.rar{font-family:var(--display);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.sec{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.lock{border-color:var(--gold);color:var(--gold)}
.fbox{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.fbh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rstat{display:flex;align-items:center;gap:8px}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rtop{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.rtop small{color:var(--muted);font-weight:400}
.rtop em{font-style:normal;font-size:10px}.rtop em.up{color:var(--good)}.rtop em.dn{color:var(--bad)}
.rbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
.rbar i{display:block;height:100%}
.rlock{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.rstat.lock .rlock{border-color:var(--gold);color:var(--gold)}
.rup{flex:none;width:34px;height:34px;padding:0;font-size:16px}
.rmax{flex:none;width:34px;text-align:center;font-size:10px;font-weight:800;color:var(--good)}
.rlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:11px;color:var(--muted)}
.rlegend span{display:inline-flex;align-items:center;gap:4px}
.rcmp{display:grid;grid-template-columns:1fr;gap:10px}
.rcmp>div{display:flex;flex-direction:column;gap:6px}
.chip small{font-size:10px;color:var(--muted)}
.chip.top{border-color:var(--good)}
.chip.top small{color:var(--good)}
.chest{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--panel2)}
.chest .cn{font-family:var(--display);font-size:17px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.mrow.done{opacity:.6}
.mrow .mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.calg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cald{display:flex;flex-direction:column;gap:3px;padding:8px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:11px;text-align:center;min-height:74px;justify-content:center}
.cald b{font-size:11px;line-height:1.2}
.cald.got{opacity:.5}
.cald.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cald:last-child{grid-column:span 2}
.plist{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow:auto}
.prow{display:grid;grid-template-columns:28px 1fr 1fr;gap:4px;align-items:stretch;opacity:.55}
.prow.open,.prow.ph{opacity:1}
.prow .pl{display:grid;place-items:center;font-weight:800;font-size:12px}
.pc{padding:6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:11px;line-height:1.25}
.prow .pc:last-child{border-color:rgba(232,176,74,.45)}
.pc.can{border-color:var(--good)!important;box-shadow:inset 0 0 0 1px var(--good)}
.pc.got{opacity:.45}
.pc.lock{opacity:.6}
.prow.ph .pc{background:none;border:0;font-weight:800;text-align:center}
.chest.offer{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,176,74,.16),var(--panel2))}
.ibtn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;font-weight:800;font-family:var(--body);padding:0;vertical-align:2px;margin-left:4px}
.ibtn:hover{color:var(--ink);border-color:var(--gold)}
.chest .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chest.inv .acts{flex-wrap:nowrap} /* los 3 botones en una línea, alineados entre filas */
.chest.inv>div:first-child{min-width:0}
@media (max-width:374px){.chest.inv{grid-template-columns:1fr}}
.demo{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.6px;text-transform:uppercase}
.odds-t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.odds-t th,.odds-t td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.odds-t th:first-child,.odds-t td:first-child{text-align:left}
.tw{overflow-x:auto}
.odds-t tr.here td{color:var(--gold);font-weight:800}
.odds-t td,.odds-t th{white-space:nowrap}
.odds-t th{font-size:10px}
.classes{display:grid;grid-template-columns:1fr;gap:10px} /* una clase por fila: nombre y pasiva */
.ccard{text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.ccard:hover{border-color:var(--gold)}
.ccard .cn{font-family:var(--display);font-size:19px}
.ccard .cs{font-size:12px;color:var(--muted);line-height:1.45}
.pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;text-transform:uppercase;letter-spacing:.5px}
.hero-title{font-family:var(--display);font-size:34px;margin:6px 0 0;line-height:1}
.filters{display:flex;flex-direction:column;gap:8px}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.fchips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--muted)}
.fchips button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fpanel .frow{flex-wrap:nowrap}
.fpanel .frow select{flex:1;min-width:0}
.frow label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
select,input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px}
input[type=number]{width:64px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.item.eq{border-color:var(--gold)}
.item .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.item .nm{font-weight:800;font-size:13px}
.star{background:none;border:0;padding:8px;margin:-8px -4px;font-size:15px;color:var(--muted)}
.star.on{color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .xclose{position:sticky;top:0;align-self:flex-end;flex:none;margin:-6px -6px -38px 0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;z-index:2}
.modal .box h3{padding-right:36px}
.modal .box{position:relative;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.modal h3{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.loot{display:flex;flex-direction:column;gap:6px}
.loot div{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));pointer-events:none;background:var(--panel2);border:1px solid var(--gold);padding:8px 14px;border-radius:10px;font-weight:800;font-size:13px;z-index:20;max-width:90%;text-align:center}
/* ruleta */
.rl{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#0b0d13;height:110px}
.rl::before,.rl::after{content:"";position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.rl::before{left:0;background:linear-gradient(90deg,#0b0d13,transparent)}.rl::after{right:0;background:linear-gradient(-90deg,#0b0d13,transparent)}
.rl-mark{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);box-shadow:0 0 10px var(--gold);z-index:3}
.rl-strip{display:flex;gap:6px;padding:8px;will-change:transform}
.cbox{position:relative;width:120px;height:110px;margin:10px auto 4px}
.cbox .base{position:absolute;left:10px;right:10px;bottom:6px;height:56px;border-radius:6px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.cbox .base i{position:absolute;left:50%;top:8px;width:16px;height:20px;margin-left:-8px;border-radius:3px;background:#1b1406;box-shadow:0 0 0 3px var(--gold)}
.cbox .lid{position:absolute;left:6px;right:6px;bottom:60px;height:30px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);transform-origin:10% 100%;z-index:2}
.cbox .glow{position:absolute;left:50%;top:40%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,160,.95),rgba(232,176,74,.35) 45%,transparent 70%);opacity:0;pointer-events:none}
.tile{flex:0 0 88px;height:92px;border-radius:9px;background:linear-gradient(180deg,var(--panel2),#161925);border-bottom:4px solid var(--rc);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center;padding:4px}
.tile .tr{font-family:var(--display);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.tile .tn{font-size:11px;font-weight:800;line-height:1.15}
.tile .tc{font-size:10px;color:var(--muted)}
.tile.win{box-shadow:0 0 0 2px var(--rc),0 0 18px var(--rc)}
.win-card{border:1px solid var(--rc);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel2);box-shadow:0 0 22px -6px var(--rc);text-align:center}
.win-card b{font-size:16px}
#rlOut{display:flex;flex-direction:column;gap:8px}
.nav button{font-size:11px;white-space:nowrap;position:relative}
.nb{position:absolute;top:2px;right:2px;min-width:15px;padding:0 3px;border-radius:8px;background:#c9302c;color:#fff;font-size:9px;font-weight:800;line-height:15px;text-align:center} /* globo encima: no ocupa ancho */
/* inventario compacto */
.ilist{display:flex;flex-direction:column;gap:4px}
.irow{border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.irow.eq{border-color:var(--gold)}
.ihd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;cursor:pointer}
.ihd .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.ihd .nm .wn{overflow:hidden;text-overflow:ellipsis}
.ihd .meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ihd .meta .rar{font-size:11px}
.idet{padding:0 10px 9px;display:flex;flex-direction:column;gap:6px}
.fpanel{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
.fabs{position:fixed;left:16px;right:16px;max-width:488px;margin:0 auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;pointer-events:none} /* Mejoras, Misiones y Auto juntos, mismo ancho */
.fab{position:relative}
.fabs .fab{pointer-events:auto}
.fabs .fab{justify-self:stretch}
/* calaveras de modo: centradas abajo, dentro del marco del juego (debajo de la pelea) */
.skbar{position:absolute;left:10px;bottom:10px;z-index:4;display:flex;gap:8px;align-items:flex-end}
.skb{position:relative;width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);color:var(--ink);display:grid;place-items:center;overflow:hidden;padding:0}
.skb.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(232,176,74,.5)}
.skb.lock{opacity:.4}
.skb .skn{font-size:10px;font-weight:800;line-height:1.1;text-align:center;padding:0 4px;z-index:1}
.skb .skn.long{font-size:8px;padding:0 1px;letter-spacing:-.2px}
#skMode .mrow.bonus{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,176,74,.14),transparent)}
.rw{display:inline-flex;align-items:center;gap:2px;white-space:nowrap;margin-right:4px}
.rw .ic{width:14px;height:14px}
.skmode{position:absolute;right:10px;bottom:6px;z-index:4;white-space:nowrap;margin:0}
.skb .skcd{position:absolute;inset:0;border-radius:50%}
.skb .skt{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;z-index:2;text-shadow:0 1px 3px #000}
.skmode{font-size:10px;font-weight:800;color:var(--muted);background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;margin-bottom:2px}

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>/* Telegram: avisa de que la app está lista y la abre a pantalla completa */
try{ const tg=window.Telegram&&Telegram.WebApp; if(tg&&tg.initData!==undefined){ tg.ready(); tg.expand(); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } }catch(e){}</script>
<div id="boot" class="boot" role="status"><b>Idle Ascension</b><span id="bootMsg">Cargando…</span></div>
<script>
/* Pantalla de carga: comprueba si hay una versión más nueva publicada (version.json, sin usar la memoria del teléfono).
   Si la hay, recarga con los archivos nuevos; si no (o sin conexión), carga el juego. Cada archivo lleva ?v=versión,
   así Telegram no puede usar una copia vieja. En local (versión DEV) no comprueba nada. */
(function(){
  var APP_VERSION='202609291409-b6440e5';                                      // tools/publicar.sh pone aquí la versión publicada
  var FILES=['config.js','engine.js','telemetry.js','control.js','tonpay.js','ui.js'];
  window.APP_VERSION=APP_VERSION;
  function load(i){ if(i>=FILES.length){ var b=document.getElementById('boot'); if(b) b.remove(); return }
    var s=document.createElement('script'); s.src=FILES[i]+(APP_VERSION==='DEV'?'':'?v='+APP_VERSION); s.charset='utf-8';
    s.onload=function(){ load(i+1) }; s.onerror=function(){ document.getElementById('bootMsg').textContent='No se pudo cargar. Revisa tu conexión.' };
    document.body.appendChild(s) }
  if(APP_VERSION==='DEV'||!window.fetch) return load(0);
  // Primero config.js (de ahí sale la dirección del servidor); luego se comprueban versión y mantenimiento; luego el resto
  var s0=document.createElement('script'); s0.src=FILES[0]+'?v='+APP_VERSION; s0.charset='utf-8'; s0.onerror=function(){ load(0) };
  s0.onload=function(){ var done=false, go=function(){ if(!done){ done=true; checkMaint() } };
    setTimeout(go,3000);                                      // sin respuesta en 3 s: sigue con lo que hay
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json() }).then(function(j){
      if(done) return;
      var key='upd_'+j.v, tried=false; try{ tried=sessionStorage.getItem(key) }catch(e){}
      if(j&&j.v&&j.v!==APP_VERSION&&!tried){                 // hay versión nueva: recarga (una sola vez, para no entrar en bucle)
        done=true; try{ sessionStorage.setItem(key,'1') }catch(e){}
        document.getElementById('bootMsg').textContent='Actualizando…';
        var u=new URL(location.href); u.searchParams.set('v',j.v); location.replace(u.toString());  // conserva los datos de Telegram (#…)
      } else go();
    }).catch(go); };
  document.body.appendChild(s0);
  // Mantenimiento ANTES de entrar: si está activo, se queda en esta pantalla y mira cada 15 s; al quitarlo, entra.
  // El resultado se deja en window.BOOT_CONTROL para que control.js no repita la consulta.
  function checkMaint(){ var url=window.CFG&&CFG.server&&CFG.server.url; if(!url) return load(1);
    var ok=false, t=setTimeout(function(){ if(!ok){ ok=true; load(1) } },3000);   // sin respuesta en 3 s: entra
    fetch(url,{cache:'no-store'}).then(function(r){ return r.ok?r.json():null }).then(function(c){ if(ok) return; ok=true; clearTimeout(t);
      if(c&&c.mantenimiento){ var b=document.querySelector('#boot b'); b.textContent='En mantenimiento';
        document.getElementById('bootMsg').textContent=String(c.mensaje||'Vuelve en unos minutos.');
        setTimeout(function(){ location.reload() },15000); }
      else { window.BOOT_CONTROL=c; load(1) }
    }).catch(function(){ if(!ok){ ok=true; clearTimeout(t); load(1) } }) }
})();
</script>
